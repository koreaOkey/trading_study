<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fractal Replay Journal Settings</title>
    <style>
      body {
        width: 360px;
        margin: 0;
        padding: 16px;
        color: #f7f8f8;
        background: #0f1011;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      label {
        display: grid;
        gap: 6px;
        margin-bottom: 12px;
        color: #9ca3af;
        font-size: 12px;
      }

      input {
        height: 36px;
        box-sizing: border-box;
        color: #f7f8f8;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px;
        padding: 0 10px;
      }

      button {
        width: 100%;
        height: 38px;
        color: #f7f8f8;
        background: #7170ff;
        border: 0;
        border-radius: 6px;
        font-weight: 800;
      }

      #status {
        min-height: 18px;
        margin-top: 10px;
        color: #10b981;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <label>API base URL<input id="apiBaseUrl" /></label>
    <label>API token<input id="apiToken" type="password" /></label>
    <button id="save">Save</button>
    <div id="status"></div>
    <script src="options.js"></script>
  </body>
</html>
